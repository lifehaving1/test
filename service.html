<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="라이프해빙 — 곧 만나요.">
<title>Coming Soon | LifeHaving</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

<style>
:root {
  --bg-warm: #F5F2EC;
  --text-primary: #0A0A0A;
  --text-secondary: #555555;
  --text-muted: #999999;
  --font-primary: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-serif: 'Cormorant Garamond', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  font-family: var(--font-primary);
  background: var(--bg-warm);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: inherit; text-decoration: none; }

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 64px 32px;
  text-align: center;
  position: relative;
}

.logo {
  position: absolute;
  top: 32px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--text-primary);
}
.logo .dot { color: #B8B8B8; }

.label {
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--text-muted);
  font-weight: 500;
  margin-bottom: 36px;
  animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
}

.title {
  font-size: clamp(40px, 6vw, 72px);
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 32px;
  animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
}
.title .em {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 300;
}

.divider {
  width: 40px;
  height: 1px;
  background: var(--text-muted);
  margin: 0 auto 56px;
  opacity: 0;
  animation: fadeIn 1.2s ease 0.7s forwards;
}

.message {
  font-size: 15px;
  line-height: 1.9;
  color: var(--text-secondary);
  letter-spacing: -0.005em;
  max-width: 480px;
  margin: 0 auto 56px;
  animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both;
}

.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  border-bottom: 1px solid var(--text-primary);
  padding-bottom: 4px;
  letter-spacing: -0.005em;
  transition: gap 0.3s ease, opacity 0.3s ease;
  animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both;
}
.back:hover { gap: 12px; opacity: 0.7; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  to { opacity: 1; }
}

@media (max-width: 768px) {
  .page { padding: 48px 24px; }
  .logo { top: 24px; }
  .label { margin-bottom: 28px; }
  .title { margin-bottom: 24px; }
  .message { margin-bottom: 40px; }
}
</style>
</head>
<body>

<main class="page">
  <a href="index.html" class="logo">lifehaving<span class="dot">.</span></a>

  <div class="label">COMING SOON</div>
  <h1 class="title">곧, <span class="em">만나요.</span></h1>
  <div class="divider"></div>

  <a href="index.html" class="back">
    돌아가기
  </a>
</main>

</body>
</html>
